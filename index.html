<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="issuer-did" content="did:web:abback-go.github.io:aij-badge">
<meta name="description" content="명지전문대학이 발급한 AI Jungle Badge가 진짜인지, 취소되지 않았는지 확인합니다.">
<title>AI Jungle Badge 검증</title>

<!-- 글꼴만 외부(jsDelivr)에서 받는다. 못 받아도 시스템 한글 글꼴로 그대로 보인다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 색: 배지 실물(정글 그린 + 구리)에서 가져온 한 벌. 강조색은 구리 하나.
     모서리: 바깥 판 20px, 안쪽 판·입력·버튼 12px. */
  :root {
    --bg: #f1f4f0;
    --surface: #fbfcfa;
    --sunken: #e6ebe5;
    --text: #14201a;
    --muted: #4f5e56;
    --line: #d3dbd2;
    --forest: #1c3829;
    --on-forest: #dfe8df;
    --accent: #99522a;
    --btn: #1c3829;
    --on-btn: #f3f6f2;
    --ok: #17663f;
    --ok-bg: #dcefe2;
    --bad: #a3241c;
    --bad-bg: #f8e2df;
    --warn: #7c5100;
    --warn-bg: #f7ebcf;
    --shadow: 0 1px 2px rgb(28 56 41 / .06), 0 12px 32px -12px rgb(28 56 41 / .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1511;
      --surface: #151e19;
      --sunken: #1d2822;
      --text: #e5ebe7;
      --muted: #9dafa4;
      --line: #28362e;
      --forest: #173024;
      --on-forest: #cfdcd2;
      --accent: #df9764;
      --btn: #e5ebe7;
      --on-btn: #0e1511;
      --ok: #80d3a4;
      --ok-bg: #15301f;
      --bad: #ff9187;
      --bad-bg: #3a1c19;
      --warn: #efc36a;
      --warn-bg: #362a11;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px -12px rgb(0 0 0 / .5);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all; /* 한국어를 음절이 아닌 어절 단위로 줄바꿈 */
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  .icon { width: 1em; height: 1em; flex: none; fill: currentColor; }

  .page { max-width: 1120px; margin: 0 auto; padding: 72px 32px 40px; }
  .layout {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: 64px; align-items: start;
  }
  .intro { position: sticky; top: 56px; }

  .eyebrow { margin: 0; color: var(--accent); font-weight: 600; font-size: 15px; }
  h1 {
    margin: 10px 0 16px; font-size: 52px; line-height: 1.15; font-weight: 750;
    letter-spacing: -0.03em;
  }
  .lede { margin: 0 0 36px; max-width: 30em; color: var(--muted); font-size: 18px; }

  .drop {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 40px 24px 32px; text-align: center; cursor: pointer;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px;
    box-shadow: var(--shadow);
  }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop.over { background: var(--sunken); }
  .drop:focus-within { outline: 3px solid var(--accent); outline-offset: 3px; }
  @supports selector(:has(*)) {  /* 마우스로 누른 뒤에는 초점 테두리를 남기지 않고, 키보드 이동 때만 보인다 */
    .drop:focus-within { outline: none; }
    .drop:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 3px; }
  }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop-icon {
    display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: 10px;
    font-size: 26px; color: var(--accent); background: var(--sunken); border-radius: 999px;
  }
  .drop-title { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
  .drop-hint { color: var(--muted); font-size: 15px; }
  .drop-btn {
    margin-top: 16px; padding: 11px 22px; font-weight: 600; font-size: 15px; white-space: nowrap;
    color: var(--on-btn); background: var(--btn); border-radius: 12px;
  }
  .privacy {
    display: flex; gap: 8px; align-items: flex-start; margin: 16px 0 0;
    color: var(--muted); font-size: 14px;
  }
  .privacy .icon { margin-top: .3em; }
  h1, .lede, .showcase figcaption, .reason, .help { text-wrap: pretty; }

  .stage { min-width: 0; }
  .showcase {
    margin: 0; padding: 48px 40px 36px; border-radius: 20px; text-align: center;
    background:
      radial-gradient(55% 45% at 50% 42%, rgb(223 151 100 / .22), transparent 70%),
      var(--forest);
    color: var(--on-forest);
  }
  .showcase img { display: block; width: min(100%, 360px); height: auto; margin: 0 auto; }
  .showcase figcaption { margin-top: 24px; font-size: 15px; }

  .result {
    padding: 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; box-shadow: var(--shadow);
  }
  .result-head {
    display: flex; gap: 20px; align-items: center; padding: 20px;
    background: var(--sunken); border-radius: 12px;
  }
  .result[data-tone="ok"] .result-head { background: var(--ok-bg); }
  .result[data-tone="bad"] .result-head { background: var(--bad-bg); }
  .result[data-tone="warn"] .result-head { background: var(--warn-bg); }
  #preview { width: 104px; height: 104px; object-fit: contain; flex: none; }
  .status {
    display: flex; gap: 8px; align-items: center; margin: 0;
    font-size: 22px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.3;
  }
  .status .icon { display: none; font-size: 26px; }
  .result[data-tone="ok"] .status { color: var(--ok); }
  .result[data-tone="bad"] .status { color: var(--bad); }
  .result[data-tone="warn"] .status { color: var(--warn); }
  .result[data-tone="ok"] .i-ok,
  .result[data-tone="bad"] .i-bad,
  .result[data-tone="warn"] .i-warn { display: block; }
  .reason { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  .cause { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  .cause summary { width: fit-content; cursor: pointer; }
  .cause summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .cause p { margin: 4px 0 0; overflow-wrap: anywhere; }
  .result[data-tone="loading"] .status { color: var(--muted); font-weight: 600; font-size: 18px; }

  .body { padding: 8px 12px 12px; }
  .body:has(#owner[hidden]) { display: none; }  /* 상세 내용이 없는 결과(실패·확인 중)는 머리 부분만 */
  dl { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 14px 20px; margin: 16px 0 4px; }
  dl:empty { display: none; }
  dt { color: var(--muted); font-size: 15px; }
  dd { margin: 0; overflow-wrap: anywhere; }
  dd.mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 15px; letter-spacing: .01em; }
  dd a { color: var(--accent); text-underline-offset: 3px; }

  .skeleton { display: none; gap: 12px; padding: 20px 12px 12px; }
  .result[data-tone="loading"] .skeleton { display: grid; }
  .skeleton span { height: 14px; border-radius: 999px; background: var(--sunken); }
  .skeleton span:nth-child(1) { width: 72%; }
  .skeleton span:nth-child(2) { width: 54%; }
  .skeleton span:nth-child(3) { width: 64%; }

  #owner { margin: 20px 0 0; padding-top: 20px; border-top: 1px solid var(--line); }
  #owner label { display: block; font-weight: 600; font-size: 15px; }
  .help { margin: 2px 0 10px; color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 8px; }
  .row input {
    flex: 1; min-width: 0; padding: 11px 14px; font: inherit; font-size: 15px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
  }
  .row input::placeholder { color: var(--muted); }
  .row input:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .row button {
    padding: 11px 20px; font: inherit; font-size: 15px; font-weight: 600; white-space: nowrap; cursor: pointer;
    color: var(--on-btn); background: var(--btn); border: 0; border-radius: 12px;
  }
  .row button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .owner-result { margin: 10px 0 0; font-size: 15px; font-weight: 600; }
  .owner-result.ok { color: var(--ok); }
  .owner-result.bad { color: var(--bad); }

  footer {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
    margin-top: 80px; padding-top: 20px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 13px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .drop { transition: border-color .2s, background-color .2s, transform .2s cubic-bezier(.16, 1, .3, 1); }
    .drop:active { transform: scale(.99); }
    .row button { transition: transform .15s cubic-bezier(.16, 1, .3, 1); }
    .row button:active { transform: translateY(1px); }
    .result.enter { animation: rise .45s cubic-bezier(.16, 1, .3, 1) both; }
    .skeleton span { animation: breathe 1.1s ease-in-out infinite alternate; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes breathe { to { opacity: .45; } }

  @media (max-width: 899px) {
    .page { padding: 40px 16px 32px; }
    .layout { grid-template-columns: minmax(0, 1fr); gap: 32px; }
    .intro { position: static; }
    h1 { font-size: 36px; }
    .lede { font-size: 16px; margin-bottom: 28px; }
    .drop { padding: 32px 20px 28px; }
    .showcase { padding: 32px 24px 28px; }
    .showcase img { width: min(100%, 240px); }
    footer { margin-top: 56px; flex-direction: column; }
  }
  @media (max-width: 479px) {
    .result-head { flex-direction: column; align-items: flex-start; gap: 12px; }
    #preview { width: 88px; height: 88px; }
    dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
    dd + dt { margin-top: 12px; }
  }
</style>
</head>

<div class="page">
  <main class="layout">
    <div class="intro">
      <p class="eyebrow">명지전문대학 · Myongji College</p>
      <h1>AI Jungle Badge 검증</h1>
      <p class="lede">받은 배지 PNG 파일을 올리면 명지전문대학이 발급한 배지가 맞는지, 취소되지 않았는지 확인합니다.</p>

      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/png">
        <span class="drop-icon"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg></span>
        <span class="drop-title">배지 PNG 파일을 올려 주세요</span>
        <span class="drop-hint">여기로 끌어다 놓거나 눌러서 고릅니다</span>
        <span class="drop-btn" aria-hidden="true">파일 선택</span>
      </label>
      <p class="privacy"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>올린 파일은 서버로 보내지 않고 이 브라우저 안에서만 검증합니다.</p>
    </div>

    <div class="stage">
      <figure class="showcase" id="showcase">
        <img src="images/lv5-jungle.png" alt="AI Jungle Badge 예시" width="1254" height="1254" fetchpriority="high" decoding="async">
        <figcaption>명지전문대학이 발급한 AI Jungle Badge는 누구나 여기서 검증할 수 있습니다.</figcaption>
      </figure>

      <section class="result" id="result" hidden aria-live="polite">
        <div class="result-head">
          <img id="preview" alt="올린 배지 이미지">
          <div>
            <p class="status">
              <svg class="icon i-ok" aria-hidden="true"><use href="#i-seal-check"/></svg>
              <svg class="icon i-bad" aria-hidden="true"><use href="#i-x-circle"/></svg>
              <svg class="icon i-warn" aria-hidden="true"><use href="#i-warning"/></svg>
              <span id="status"></span>
            </p>
            <p id="reason" class="reason"></p>
            <details id="cause" class="cause" hidden>
              <summary>자세한 원인</summary>
              <p id="cause-text"></p>
            </details>
          </div>
        </div>
        <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="body">
          <dl id="details"></dl>
          <form id="owner" hidden>

            <div class="row">
              <input id="email" type="email" placeholder="name@example.com" aria-describedby="email-help" required>
              <button type="submit">확인</button>
            </div>
            <p id="owner-result" class="owner-result"></p>
          </form>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <span>확인을 위해 발급기관의 공개키와 취소 목록만 불러옵니다.</span>
    <span>1EdTech Open Badges 3.0 표준 배지</span>
  </footer>
</div>

<script type="module">
  import { MAX_FILE_BYTES, checkOwner, verifyBadge } from "./verify.js";

  const issuerDid = document.querySelector('meta[name="issuer-did"]').content;
  const $ = (id) => document.getElementById(id);

  // 배지 안의 문자열은 외부 입력이므로 항상 textContent로만 넣는다(innerHTML 금지).
  const STATUS = {
    valid:   ["ok",   "유효한 배지",           "명지전문대학이 발급했고 취소되지 않은 배지입니다."],
    revoked: ["bad",  "취소된 배지",           "발급기관이 이 배지를 취소했습니다."],
    invalid: ["bad",  "검증 실패",             null],
    foreign: ["warn", "다른 기관이 발급한 배지", "명지전문대학이 발급한 AI Jungle Badge가 아닙니다."],
    unknown: ["warn", "취소 여부 확인 불가",    "서명은 유효하지만 취소 목록을 불러오지 못했습니다. 잠시 후 다시 확인하세요."],
    error:   ["warn", "확인할 수 없음",         null],
  };
  const SHOW_DETAILS = new Set(["valid", "revoked", "unknown"]);
  const narrow = matchMedia("(max-width: 899px)");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

  let current = null;
  let previewUrl = null;

  function formatDate(iso) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso || "";
    return d.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", timeZone: "Asia/Seoul" });
  }

  function renderDetails(info) {
    const rows = [
      ["배지", info.badgeName],
      ["받은 사람", info.name],
      ["발급번호", info.credentialNo, "mono"],
      ["발급일", formatDate(info.issuedAt)],
      ["발급기관", info.issuerName],
      ["취득 기준", info.criteria],
    ];
    const dl = $("details");
    dl.replaceChildren();
    for (const [label, value, cls] of rows) {
      if (!value) continue;
      const dt = document.createElement("dt");
      const dd = document.createElement("dd");
      dt.textContent = label;
      dd.textContent = value;
      if (cls) dd.className = cls;
      dl.append(dt, dd);
    }
    for (const item of info.evidence || []) {
      const dt = document.createElement("dt");
      const dd = document.createElement("dd");
      dt.textContent = "결과물";
      if (item.narrative) dd.append(item.narrative);
      if (item.url) {  // verify.js가 http(s) 주소만 넘긴다
        const a = document.createElement("a");
        a.href = item.url;
        a.textContent = item.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        if (item.narrative) dd.append(document.createElement("br"));
        dd.append(a);
      }
      dl.append(dt, dd);
    }
  }

  // 결과 카드가 새 상태로 바뀌었음을 보여 주는 짧은 등장 효과(움직임 줄이기 설정이면 CSS가 끈다)
  function replayEnter(el) {
    el.classList.remove("enter");
    void el.offsetWidth;
    el.classList.add("enter");
  }

  function clearOwnerResult() {
    $("owner-result").textContent = "";
    $("owner-result").className = "owner-result";
  }

  let latest = 0;  // 검증 도중 다른 파일을 고르면 먼저 시작한 검증의 결과는 버린다

  async function handle(file) {
    if (!file) return;
    const mine = ++latest;
    current = null;
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    // 너무 큰 파일은 메모리에 읽기 전에(미리보기도 만들지 않고) 거부한다
    const tooBig = file.size > MAX_FILE_BYTES;
    previewUrl = tooBig ? null : URL.createObjectURL(file);
    $("preview").hidden = tooBig;
    if (previewUrl) $("preview").src = previewUrl;
    $("showcase").hidden = true;
    $("result").hidden = false;
    $("result").dataset.tone = "loading";
    $("status").textContent = "확인 중…";
    $("reason").textContent = "";
    $("cause").hidden = true;
    $("cause").open = false;
    $("cause-text").textContent = "";
    $("details").replaceChildren();
    $("owner").hidden = true;
    clearOwnerResult();
    replayEnter($("result"));
    if (narrow.matches) {  // 한 단 화면에서는 결과가 파일 선택 칸 아래에 있으므로 그쪽으로 옮겨 준다
      $("result").scrollIntoView({ block: "start", behavior: reduceMotion.matches ? "auto" : "smooth" });
    }

    let result;
    if (tooBig) {
      result = { status: "invalid", reason: "파일이 너무 큽니다. 배지 PNG 파일인지 확인하세요." };
    } else {
      try {
        result = await verifyBadge(new Uint8Array(await file.arrayBuffer()), { issuerDid });
      } catch (e) {  // 예상 못 한 오류에도 '확인 중'에 멈춰 있지 않게
        result = { status: "error", reason: `확인 중 오류가 났습니다. (${e.message})` };
      }
    }
    if (mine !== latest) return;
    const [tone, label, text] = STATUS[result.status];
    $("result").dataset.tone = tone;
    $("status").textContent = label;
    $("reason").textContent = text || result.reason || "";
    if (result.detail) {
      $("cause-text").textContent = result.detail;
      $("cause").hidden = false;
    }
    current = result;
    if (SHOW_DETAILS.has(result.status)) {
      renderDetails(result.info);
      $("owner").hidden = false;
    }
  }

  $("file").addEventListener("change", (e) => {
    handle(e.target.files[0]);
    e.target.value = "";
  });
  const drop = $("drop");
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    handle(e.dataTransfer.files[0]);
  });

  // 주소를 고치거나 지우면 이전 확인 결과는 지금 입력한 주소에 대한 답이 아니다
  $("email").addEventListener("input", clearOwnerResult);

  $("owner").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!current) return;
    const match = await checkOwner(current.payload, $("email").value);
    $("owner-result").className = `owner-result ${match ? "ok" : "bad"}`;
    $("owner-result").textContent = match
      ? "이 이메일 주소로 발급된 배지입니다."
      : "이 이메일 주소로 발급된 배지가 아닙니다.";
  });
</script>
</body>
</html>
